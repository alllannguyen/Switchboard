services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/switchboard:/etc/nginx/switchboard
    depends_on:
      - blue
      - green

  blue:
    build: ./demo-app
    environment:
      APP_ENV: "blue"
      APP_VERSION: "${BLUE_VERSION:-1}"
      APP_MESSAGE: "${BLUE_MESSAGE:-The original release}"
      APP_COLOR: "${BLUE_COLOR:-#2563eb}"
      BROKEN: "${BLUE_BROKEN:-false}"

  green:
    build: ./demo-app
    environment:
      APP_ENV: "green"
      APP_VERSION: "${GREEN_VERSION:-1}"
      APP_MESSAGE: "${GREEN_MESSAGE:-The original release}"
      APP_COLOR: "${GREEN_COLOR:-#2563eb}"
      BROKEN: "${GREEN_BROKEN:-false}"
