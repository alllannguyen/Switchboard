events {}

http {
  # Written by the dashboard: defines the upstream "active" pointing at blue or green.
  include /etc/nginx/switchboard/active.conf;

  server {
    listen 80;

    location / {
      proxy_pass http://active;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
